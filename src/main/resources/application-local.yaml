server:  port: 8080logging:  level:    root: INFO                       #스프링과 라이브러리는 INFO 이상만 출력    com.tenco.spring_blog: DEBUG     #우리 코드는 DEBUG 이상까지spring:  # 데이터 베이스 연결 (H2 메모리 DB 사용)  datasource:    driver-class-name: com.mysql.cj.jdbc.Driver    url: ${DB_URL}    username: ${DB_USERNAME}    password: ${DB_PASSWORD}  # H2  콘솔 화면 켜기 (http://localhost:8080/h2-console)  h2:    console:      enabled: true  # JPA 설정  jpa:    # true : 기본값. 뷰 렌더링 까지 영속성 컨텍스트 유지, 지연로딩 가능    # false : 트랜잭션이 끝나면 영속성 컨텍스트 종료. 지연로딩 불가능    open-in-view: false    hibernate:      # 시작할 때마다 테이블을 새로 만듭니다. 기존 데이터는 다 지워집니다(개발용)      ddl-auto: create    # 실행되는 SQL을 콘솔에 출력합니다    show-sql: true    properties:      hibernate:        default_batch_fetch_size: 10 # 무조건 세팅. 복잡한 조회쿼리(findAll등) 작성시, IN절로 모두 모와서 함.        format_sql: true     # 출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시    # 추후 data.sql 을 테이블 생성후에 실행합니다    defer-datasource-initialization: true  # 서버 시작시 이 파일 실행  sql:    init:      mode: always      encoding: UTF-8      data-locations:        - classpath:db/data.sql