logging:  level:    root: INFO    com.example.spring_blog: INFOspring:  datasource:    driver-class-name: com.mysql.cj.jdbc.Driver    url: ${DB_URL}    username: ${DB_USERNAME}    password: ${DB_PASSWORD}  # JPA 설정  jpa:    # true : 기본값. 뷰 렌더링 까지 영속성 컨텍스트 유지, 지연로딩 가능    # false : 트랜잭션이 끝나면 영속성 컨텍스트 종료. 지연로딩 불가능    open-in-view: false    hibernate:      # 운영에서는 create 를 쓰지 않습니다. 없는 테이블과 컬럼만 추가합니다      ddl-auto: update    properties:      hibernate:        default_batch_fetch_size: 10    # 실행되는 SQL을 콘솔에 출력합니다    show-sql: true    # 추후 data.sql 을 테이블 생성후에 실행합니다    defer-datasource-initialization: true