server:  port: 8080logging:  level:    root: INFO    com.example.spring_blog: debug  #디버그 이상까지.spring:  #DB연결 h2 메모리 DB 사용  datasource:    driver-class-name: org.h2.Driver    url: jdbc:h2:mem:blogdb    username: sa    password:  #콘솔화면켜기 http://localhost:8080/h2-console  h2:    console:      enabled: true  jpa:    # true : 기본값. 뷰 렌더링 까지 영속성 컨텍스트 유지, 지연로딩 가능    # false : 트랜잭션이 끝나면 영속성 컨텍스트 종료. 지연로딩 불가능    open-in-view: false    hibernate:      #시작할 때마다 테이블을 새로 만듦      ddl-auto: create    #실행되는 sql을 콘솔에 출력    show-sql: true    properties:      hibernate:        format_sql: true  #출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시    #추후 data.sql을 테이블 생성 후에 실행함    defer-datasource-initialization: true  sql:    init:      data-locations:        - classpath:db/data.sql